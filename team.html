<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Overview | IPL 2026</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Team Default Variables */
        :root {
            --team-primary: #00d2ff;
            --team-secondary: #3a7bd5;
        }

        /* Specific Team Styles Overriding Globals */
        .team-bg-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 80vw;
            height: 80vh;
            object-fit: contain;
            transform: translate(-50%, -50%) rotateY(20deg) rotateX(10deg);
            opacity: 0.15;
            z-index: -2;
            pointer-events: none;
            filter: drop-shadow(0 0 50px var(--team-primary));
    animation: bgFloat 10s ease-in-out infinite alternate;
    width: clamp(300px, 80vw, 800px);
    height: auto;
    max-height: 80vh;
}
        @keyframes bgFloat {
            0% { transform: translate(-50%, -50%) rotateY(20deg) rotateX(10deg) scale(1); }
            100% { transform: translate(-50%, -50%) rotateY(-20deg) rotateX(-10deg) scale(1.05); }
        }
        .team-hero {
            height: 60vh;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding-bottom: 4rem;
            overflow: hidden;
            background: linear-gradient(to top, var(--bg-primary) 0%, transparent 100%);
        }

        .team-hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 70% 30%, var(--team-primary), transparent 60%);
            opacity: 0.2;
            z-index: -1;
        }

        .team-header-content {
            display: flex;
            align-items: center;
            gap: 3rem;
            z-index: 10;
        }

        .team-logo-hero {
            width: 200px;
            height: 200px;
            object-fit: contain;
            filter: drop-shadow(0 0 30px var(--team-primary));
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotateY(0deg); }
            50% { transform: translateY(-20px) rotateY(10deg); }
            100% { transform: translateY(0px) rotateY(0deg); }
        }

        .team-details h1 {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .team-details p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .team-gradient-text {
            background: linear-gradient(135deg, var(--team-primary), #fff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Nav specific overrides */
        .navbar .logo .gradient-text {
            background: linear-gradient(135deg, var(--team-primary), var(--team-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Squad section */
        .squad-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
        }

        .player-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-bottom: 4px solid var(--team-primary);
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            transition: var(--transition-smooth);
            cursor: pointer;
            transform-style: preserve-3d;
        }

        .player-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            border-color: var(--team-primary);
        }

        .player-img-wrapper {
            height: 200px;
            background: linear-gradient(0deg, rgba(0,0,0,0.5), transparent);
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .player-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            opacity: 0.8;
            filter: grayscale(100%);
            transition: 0.4s;
        }

        .player-card:hover .player-img-wrapper img {
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.05);
        }

        .player-card-info {
            padding: 1.5rem 1rem;
            position: relative;
            z-index: 2;
        }

        .player-card-info h3 {
            font-size: 1.2rem;
            margin-bottom: 0.2rem;
            color: var(--text-primary);
            transform: translateZ(20px);
        }

        .player-card-info p {
            font-size: 0.85rem;
            color: var(--team-primary);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Records & Ground */
        .records-ground-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 4rem;
        }

        .records-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2.5rem;
        }

        .records-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .record-item h4 {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .record-item p {
            font-size: 2rem;
            font-weight: 800;
            color: var(--team-primary);
        }

        .ground-card {
            background: linear-gradient(0deg, rgba(10,10,15,0.9), rgba(10,10,15,0.5)), url('https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80') center/cover;
            border-radius: 16px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 300px;
            border: 1px solid var(--glass-border);
        }

        .ground-card h3 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .ground-card p {
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Back button */
        .back-btn {
            position: fixed;
            top: 100px;
            left: 2rem;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--glass-bg);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            z-index: 100;
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="dark-theme">
    <img id="team-bg-logo-img" class="team-bg-logo" src="" alt="">
    <nav class="navbar glass scrolled">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/8/84/Indian_Premier_League_Official_Logo.svg/1200px-Indian_Premier_League_Official_Logo.svg.png" style="height:40px; vertical-align:middle; margin-right:10px;">
                <span class="gradient-text">IPL</span> 2026
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Back to Home</a></li>
            </ul>
        </div>
    </nav>

    <a href="index.html" class="back-btn">← Home</a>

    <header class="team-hero" id="team-hero">
        <div class="container team-header-content">
            <img src="" alt="Team Logo" class="team-logo-hero" id="team-hero-logo">
            <div class="team-details">
                <h1 id="team-hero-name" class="team-gradient-text">Team Name</h1>
                <p id="team-hero-stadium">Home Ground</p>
            </div>
        </div>
    </header>

    <section class="section-padding">
        <div class="container">
            <h2 class="section-title">Squad <span class="team-gradient-text" id="team-squad-title">2026</span></h2>
            <div class="squad-grid" id="squad-grid">
                <!-- Squad injected by JS -->
            </div>
        </div>
    </section>

    <section class="section-padding glass-section pt-0">
        <div class="container records-ground-grid">
            <div class="records-card">
                <h3 style="font-size: 1.8rem; margin-bottom: 2rem;">Team Records</h3>
                <div class="records-grid">
                    <div class="record-item">
                        <h4>Titles Won</h4>
                        <p id="rec-titles">0</p>
                    </div>
                    <div class="record-item">
                        <h4>Highest Score</h4>
                        <p id="rec-score">0</p>
                    </div>
                    <div class="record-item">
                        <h4>Best Player</h4>
                        <p id="rec-player" style="font-size: 1.2rem;">-</p>
                    </div>
                    <div class="record-item">
                        <h4>Win %</h4>
                        <p id="rec-win">0%</p>
                    </div>
                </div>
            </div>

            <div class="ground-card" id="ground-card">
                <h3 id="ground-name">Stadium</h3>
                <p>📍 <span id="ground-location">Location</span></p>
            </div>
        </div>
    </section>

    <!-- Fixtures -->
    <section class="section-padding pt-0">
        <div class="container">
            <h2 class="section-title">2026 <span class="team-gradient-text">Fixtures</span></h2>
            <div class="fixtures-grid" id="team-fixtures-container">
                <!-- Fixtures injected by JS -->
            </div>
        </div>
    </section>

    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>
        // Init Team Page Specifically
        document.addEventListener('DOMContentLoaded', () => {
            if(typeof loadTeamDetails === 'function') {
                loadTeamDetails();
            }
        });
    </script>
</body>
</html>
